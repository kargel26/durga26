<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#35030b">

<title>दुर्गा पूजा की हार्दिक शुभकामनाएं 🌺</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap');

:root{
    --red:#8e0b20;
    --deep:#25030a;
    --maroon:#4b0612;
    --gold:#ffd45b;
    --gold2:#e99b21;
    --cream:#fff2bd;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    font-family:"Noto Sans Devanagari",sans-serif;
    color:var(--cream);

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(255,174,39,.25),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(165,13,38,.35),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(255,180,45,.12),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #21030a,
            #690817 48%,
            #26020a
        );
}

/* =================================
   MAIN PAGE
================================= */

.page{
    min-height:100svh;
    position:relative;
    overflow:hidden;
    isolation:isolate;
}

.page::before{
    content:"";
    position:absolute;
    inset:-30%;
    z-index:-3;

    background:
        repeating-radial-gradient(
            ellipse at center,
            transparent 0 85px,
            rgba(255,210,90,.025) 86px 87px
        );

    animation:backgroundSpin 65s linear infinite;
}

.page::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,.15) 60%,
            rgba(0,0,0,.65) 100%
        );
}

/* =================================
   BORDER
================================= */

.border{
    position:fixed;
    inset:8px;
    border:1px solid rgba(255,215,100,.35);
    border-radius:20px;
    pointer-events:none;
    z-index:50;
}

.border::before,
.border::after{
    content:"";
    position:absolute;

    width:75px;
    height:75px;

    border:2px solid rgba(255,215,100,.35);
}

.border::before{
    left:-2px;
    top:-2px;

    border-right:0;
    border-bottom:0;

    border-radius:18px 0 0 0;
}

.border::after{
    right:-2px;
    bottom:-2px;

    border-left:0;
    border-top:0;

    border-radius:0 0 18px 0;
}

/* =================================
   DECORATIVE MOTIFS
================================= */

.decor{
    position:fixed;
    inset:20px;
    pointer-events:none;
    z-index:40;
}

.motif{
    position:absolute;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--gold);
    font-size:25px;

    filter:
        drop-shadow(0 0 7px rgba(255,195,50,.8));

    animation:
        motifFloat 4s ease-in-out infinite;
}

.motif:nth-child(1){
    left:1%;
    top:15%;
}

.motif:nth-child(2){
    right:1%;
    top:23%;
}

.motif:nth-child(3){
    left:2%;
    bottom:22%;
}

.motif:nth-child(4){
    right:2%;
    bottom:18%;
}

.motif:nth-child(5){
    left:50%;
    top:0;
}

.motif:nth-child(6){
    left:50%;
    bottom:0;
}

/* =================================
   HERO
================================= */

.hero{
    min-height:100svh;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:
        48px
        15px
        35px;

    text-align:center;

    position:relative;
    z-index:5;
}

.topline{
    color:#ffd66b;
    font-size:12px;
    letter-spacing:2px;

    animation:
        slideDown .8s both;
}

/* =================================
   HEADING
================================= */

h1{
    margin-top:8px;

    line-height:1.12;

    font-family:
        "Tiro Devanagari Hindi",
        "Noto Sans Devanagari",
        serif;

    font-size:
        clamp(
            2rem,
            7vw,
            5rem
        );

    animation:
        slideUp 1s .1s both;
}

h1 span:first-child{
    display:block;

    background:
        linear-gradient(
            120deg,
            #fff0a0,
            #ffc33d,
            #fff5c7,
            #df8e17,
            #ffe38c
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 22px rgba(255,180,40,.3);
}

h1 span:last-child{
    display:block;

    color:#ffe9a8;

    font-size:.70em;

    margin-top:4px;
}

.subtitle{
    margin-top:10px;

    color:#ffd98b;

    font-size:
        clamp(
            .85rem,
            2.5vw,
            1.18rem
        );

    animation:
        fadeIn 1s .65s both;
}

.name{
    margin-top:9px;

    color:#fff0bb;

    font-size:14px;

    animation:
        fadeIn 1s .8s both;
}

.name b{
    color:#ffd04c;
}

/* =================================
   COUNTDOWN
================================= */

.countdown{
    width:min(900px,96vw);

    margin:
        18px auto 12px;

    animation:
        slideUp 1s .9s both;
}

.count-title{
    margin-bottom:9px;

    font-family:
        "Tiro Devanagari Hindi",
        serif;

    color:#ffe294;

    font-size:
        clamp(
            1rem,
            3vw,
            1.45rem
        );

    text-shadow:
        0 0 12px rgba(255,190,50,.35);
}

.timer{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.time-card{
    padding:11px 5px 8px;

    border:
        1px solid
        rgba(255,213,104,.48);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(121,10,26,.65),
            rgba(45,3,10,.58)
        );

    backdrop-filter:blur(12px);

    box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 10px 28px rgba(0,0,0,.25);
}

.number{
    color:#ffe28b;

    font-size:
        clamp(
            1.5rem,
            6vw,
            2.7rem
        );

    line-height:1;

    font-weight:800;

    text-shadow:
        0 0 14px rgba(255,183,38,.35);
}

.label{
    margin-top:5px;

    color:#eec879;

    font-size:11px;
}

.pulse{
    animation:
        numberPulse .45s ease;
}

.finished{
    grid-column:1/-1;

    padding:20px;

    border:
        1px solid #f4c64e;

    border-radius:18px;

    background:
        rgba(80,5,18,.65);

    color:#ffe79c;

    font-size:
        clamp(
            1rem,
            4vw,
            1.5rem
        );
}

/* =================================
   REALISTIC DURGA IMAGE
================================= */

.hero-image{
    position:relative;

    width:
        min(
            720px,
            98vw
        );

    margin-top:5px;

    overflow:hidden;

    border-radius:28px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        0 0 45px rgba(255,184,42,.22);

    animation:
        imageEntrance 1.3s 1.05s both;
}

.hero-image img{
    display:block;

    width:100%;

    aspect-ratio:
        1.45 / 1;

    object-fit:cover;

    object-position:center 58%;

    filter:
        saturate(1.08)
        contrast(1.05);
}

/* =================================
   DIVINE HALO
================================= */

.halo{
    position:absolute;

    left:50%;
    top:36%;

    width:37%;

    aspect-ratio:1;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    border:
        2px solid
        rgba(255,220,120,.65);

    box-shadow:
        0 0 25px
        rgba(255,198,55,.65),

        0 0 70px
        rgba(255,165,25,.25);

    z-index:2;

    pointer-events:none;

    animation:
        haloRotate 10s linear infinite;
}

.halo::before,
.halo::after{
    content:"";

    position:absolute;

    inset:-9%;

    border-radius:50%;

    border:
        1px dashed
        rgba(255,215,100,.5);
}

.halo::after{
    inset:8%;

    border-style:solid;

    opacity:.5;
}

/* =================================
   MESSAGE
================================= */

.message{
    width:
        min(
            760px,
            95vw
        );

    margin-top:14px;

    padding:
        15px
        17px;

    border:
        1px solid
        rgba(255,211,91,.3);

    border-radius:18px;

    background:
        rgba(73,5,15,.58);

    backdrop-filter:blur(10px);

    font-family:
        "Tiro Devanagari Hindi",
        serif;

    font-size:
        clamp(
            .9rem,
            2.7vw,
            1.12rem
        );

    line-height:1.8;

    animation:
        slideUp 1s 1.3s both;
}

.message strong{
    color:#ffd05b;
}

/* =================================
   CTA
================================= */

.cta{
    margin-top:13px;

    min-height:48px;

    padding:
        12px
        25px;

    border:
        1px solid
        #ffe28a;

    border-radius:100px;

    color:#4b0b06;

    background:
        linear-gradient(
            135deg,
            #ffe89b,
            #efa82b,
            #ffd965
        );

    font:
        800 14px
        "Noto Sans Devanagari",
        sans-serif;

    cursor:pointer;

    box-shadow:
        0 0 22px
        rgba(255,185,40,.38);

    transition:.25s;

    animation:
        fadeIn 1s 1.55s both;
}

.cta:hover{
    transform:
        translateY(-2px)
        scale(1.02);

    box-shadow:
        0 0 30px
        rgba(255,190,45,.6);
}

.cta:active{
    transform:scale(.97);
}

/* =================================
   DIYAS
================================= */

.diyas{
    display:flex;

    justify-content:center;

    gap:28px;

    margin-top:14px;
}

.diya{
    position:relative;

    width:44px;
    height:17px;

    border-radius:
        0 0 25px 25px;

    background:
        linear-gradient(
            #f2ae35,
            #76200b
        );

    box-shadow:
        0 0 10px
        rgba(255,172,40,.3);
}

.flame{
    position:absolute;

    left:50%;
    bottom:10px;

    width:13px;
    height:22px;

    transform:
        translateX(-50%);

    border-radius:
        70% 30% 70% 30%;

    background:
        linear-gradient(
            #fff9ad,
            #ff9b1d,
            #db360d
        );

    box-shadow:
        0 0 18px #ffae2c;

    animation:
        flame 0.8s
        ease-in-out
        infinite alternate;
}

/* =================================
   PARTICLES
================================= */

.particles,
.petals{
    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:3;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#ffd66a;

    box-shadow:
        0 0 9px #ffc12e;

    animation:
        particleRise
        linear
        infinite;
}

.petal{
    position:absolute;

    top:-30px;

    width:9px;
    height:14px;

    border-radius:
        70% 30% 70% 30%;

    background:
        linear-gradient(
            135deg,
            #ffcc59,
            #d62b27
        );

    opacity:.85;

    animation:
        petalFall
        linear
        infinite;
}

/* =================================
   ANIMATIONS
================================= */

@keyframes backgroundSpin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:
            translateY(28px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

@keyframes slideDown{
    from{
        opacity:0;
        transform:
            translateY(-15px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

@keyframes imageEntrance{
    from{
        opacity:0;
        transform:
            scale(.96)
            translateY(22px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

@keyframes haloRotate{
    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

@keyframes numberPulse{
    50%{
        transform:scale(1.07);

        text-shadow:
            0 0 25px
            #ffd05a;
    }
}

@keyframes flame{
    to{
        transform:
            translateX(-50%)
            rotate(6deg)
            scale(1.08);
    }
}

@keyframes motifFloat{
    50%{
        transform:
            translateY(-7px);
    }
}

@keyframes particleRise{
    from{
        transform:
            translate3d(
                0,
                105vh,
                0
            );

        opacity:0;
    }

    15%{
        opacity:.8;
    }

    85%{
        opacity:.8;
    }

    to{
        transform:
            translate3d(
                var(--drift),
                -10vh,
                0
            );

        opacity:0;
    }
}

@keyframes petalFall{
    to{
        transform:
            translate3d(
                var(--sway),
                110vh,
                0
            )
            rotate(720deg);
    }
}

/* =================================
   GOLDEN BURST
================================= */

.burst{
    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ffd75e;

    box-shadow:
        0 0 12px #ffb51e;

    z-index:100;

    pointer-events:none;
}

/* =================================
   TOAST
================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:28px;

    transform:
        translate(-50%,30px);

    opacity:0;

    z-index:110;

    width:
        min(
            92vw,
            560px
        );

    padding:
        14px
        18px;

    border-radius:50px;

    text-align:center;

    font-weight:800;

    color:#4a0a06;

    background:
        linear-gradient(
            135deg,
            #ffe69a,
            #efa82b
        );

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.4),

        0 0 28px
        rgba(255,187,44,.45);

    transition:.45s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =================================
   MOBILE
================================= */

@media(max-width:600px){

    .hero{
        padding:
            43px
            10px
            28px;
    }

    .border{
        inset:5px;
        border-radius:15px;
    }

    .decor{
        inset:13px;
    }

    .motif{
        font-size:19px;
        width:30px;
        height:30px;
    }

    .timer{
        gap:6px;
    }

    .time-card{
        padding:
            9px
            2px
            7px;

        border-radius:12px;
    }

    .number{
        font-size:
            clamp(
                1.35rem,
                9vw,
                2rem
            );
    }

    .label{
        font-size:9px;
    }

    .hero-image{
        width:100%;
        border-radius:22px;
    }

    .hero-image img{
        aspect-ratio:1/1.12;

        object-position:
            center 55%;
    }

    .halo{
        top:36%;
        width:43%;
    }

    .message{
        font-size:.88rem;
    }
}

/* =================================
   REDUCED MOTION
================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="border"></div>

    <!-- Decorative motifs -->
    <div class="decor">

        <span class="motif">🔱</span>
        <span class="motif">🐚</span>
        <span class="motif">🪔</span>
        <span class="motif">🪷</span>
        <span class="motif">🌺</span>
        <span class="motif">🔔</span>

    </div>

    <!-- Animated particles -->
    <div class="particles" id="particles"></div>

    <!-- Falling flowers -->
    <div class="petals" id="petals"></div>


    <main class="hero">

        <div class="topline">
            ॥ जय माता दी ॥
        </div>


        <h1>

            <span>
                दुर्गा पूजा
            </span>

            <span>
                की हार्दिक शुभकामनाएं
            </span>

        </h1>


        <div class="subtitle">

            माँ दुर्गा की भक्ति और शक्ति का पावन पर्व

        </div>


        <!-- CHANGE YOUR NAME HERE -->

        <div class="name">

            सप्रेम शुभकामनाएं —
            <b id="displayName">
                आपके अपने
            </b>

        </div>


        <!-- =================================
             COUNTDOWN
        ================================= -->

        <section
            class="countdown"
            aria-live="polite"
        >

            <div class="count-title">

                🌺 दुर्गा पूजा आने में शेष 🌺

            </div>


            <div
                class="timer"
                id="timer"
            >

                <div class="time-card">

                    <div
                        class="number"
                        id="days"
                    >
                        --
                    </div>

                    <div class="label">
                        दिन
                    </div>

                </div>


                <div class="time-card">

                    <div
                        class="number"
                        id="hours"
                    >
                        --
                    </div>

                    <div class="label">
                        घंटे
                    </div>

                </div>


                <div class="time-card">

                    <div
                        class="number"
                        id="minutes"
                    >
                        --
                    </div>

                    <div class="label">
                        मिनट
                    </div>

                </div>


                <div class="time-card">

                    <div
                        class="number"
                        id="seconds"
                    >
                        --
                    </div>

                    <div class="label">
                        सेकंड
                    </div>

                </div>

            </div>

        </section>


        <!-- =================================
             REALISTIC DURGA
        ================================= -->

        <section
            class="hero-image"
            aria-label="माँ दुर्गा का भव्य रूप"
        >

            <div class="halo"></div>


            <!--
            IMPORTANT:
            Put your realistic Durga image
            in the same folder as this HTML
            and name it:

            durga-maa.png

            -->

            <img
                src="durga-maa.png"
                alt="माँ दुर्गा का भव्य और यथार्थवादी रूप"
            >

        </section>


        <!-- =================================
             GREETING
        ================================= -->

        <div class="message">

            सुख, शांति, समृद्धि और शक्ति बनी रहे।

            <br>

            <strong>
                जय माता दी! 🙏🌺
            </strong>

        </div>


        <!-- =================================
             CTA
        ================================= -->

        <button
            class="cta"
            id="blessBtn"
        >

            🙏 माँ दुर्गा का आशीर्वाद लें

        </button>


        <!-- Diyas -->

        <div class="diyas">

            <div class="diya">
                <i class="flame"></i>
            </div>

            <div class="diya">
                <i class="flame"></i>
            </div>

            <div class="diya">
                <i class="flame"></i>
            </div>

        </div>

    </main>

</div>


<script>

/* =========================================
   YOUR NAME
========================================= */

const YOUR_NAME = "आपके अपने";

document.getElementById(
    "displayName"
).textContent = YOUR_NAME;


/* =========================================
   DURGA PUJA COUNTDOWN

   16 October 2026
   00:00 IST

   After this date automatically
   moves to next year.
========================================= */

function getNextDurgaPuja(){

    const now = new Date();

    const year =
        now.getFullYear();

    let target =
        new Date(
            `${year}-10-16T00:00:00+05:30`
        );

    if(
        now.getTime() >=
        target.getTime()
    ){

        target =
            new Date(
                `${year + 1}-10-16T00:00:00+05:30`
            );

    }

    return target;
}


let target =
    getNextDurgaPuja();


function pad(number){

    return String(number)
        .padStart(2,"0");

}


function updateCountdown(){

    const now =
        new Date();

    let difference =
        target.getTime()
        -
        now.getTime();


    /* Festival arrived */

    if(difference <= 0){

        document.getElementById(
            "timer"
        ).innerHTML = `

            <div class="finished">

                🔱 शुभ दुर्गा पूजा!
                जय माता दी 🙏

            </div>

        `;

        return;

    }


    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400)
            / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600)
            / 60
        );


    const seconds =
        totalSeconds % 60;


    const values = {

        days:pad(days),

        hours:pad(hours),

        minutes:pad(minutes),

        seconds:pad(seconds)

    };


    for(
        const id in values
    ){

        const element =
            document.getElementById(id);


        if(
            element.textContent
            !==
            values[id]
        ){

            element.textContent =
                values[id];


            /* Pulse every change */

            element.classList.remove(
                "pulse"
            );


            void element.offsetWidth;


            element.classList.add(
                "pulse"
            );

        }

    }

}


/* Start timer */

updateCountdown();


/* Update every second */

setInterval(
    updateCountdown,
    1000
);

/* =========================================
   BLESSING BUTTON
========================================= */

const button =
    document.getElementById(
        "blessBtn"
    );


button.addEventListener(
    "click",
    function(event){

        /* Screen divine flash */

        document.body.animate(

            [
                {
                    filter:
                        "brightness(1)"
                },

                {
                    filter:
                        "brightness(1.5)"
                },

                {
                    filter:
                        "brightness(1)"
                }

            ],

            {
                duration:900,
                easing:"ease-out"
            }

        );


        /* Halo expands */

        const halo =
            document.querySelector(
                ".halo"
            );


        halo.animate(

            [

                {
                    transform:
                        "translate(-50%,-50%) scale(1)"
                },

                {
                    transform:
                        "translate(-50%,-50%) scale(1.35)"
                },

                {
                    transform:
                        "translate(-50%,-50%) scale(1)"
                }

            ],

            {

                duration:1100,

                easing:
                    "cubic-bezier(.2,.8,.2,1)"

            }

        );


        /* Diyas glow */

        document
            .querySelectorAll(
                ".flame"
            )
            .forEach(
                flame => {

                    flame.animate(

                        [

                            {
                                transform:
                                    "translateX(-50%) scale(1)"
                            },

                            {
                                transform:
                                    "translateX(-50%) scale(1.8)"
                            },

                            {
                                transform:
                                    "translateX(-50%) scale(1)"
                            }

                        ],

                        {
                            duration:1000
                        }

                    );

                }
            );


        /* =================================
           GOLDEN DIVINE BURST
        ================================= */

        for(
            let i = 0;
            i < 45;
            i++
        ){

            const spark =
                document.createElement(
                    "span"
                );


            spark.className =
                "burst";


            spark.style.left =
                "50%";


            spark.style.top =
                "43%";


            document.body.appendChild(
                spark
            );


            const angle =
                Math.random()
                *
                Math.PI
                *
                2;


            const distance =
                80 +
                Math.random() * 280;


            const x =
                Math.cos(angle)
                *
                distance;


            const y =
                Math.sin(angle)
                *
                distance;


            spark.animate(

                [

                    {
                        transform:
                            "translate(-50%,-50%) scale(1)",
                        opacity:1
                    },

                    {
                        transform:
                            `
                            translate(
                                calc(-50% + ${x}px),
                                calc(-50% + ${y}px)
                            )
                            scale(0)
                            `,

                        opacity:0
                    }

                ],

                {

                    duration:
                        650 +
                        Math.random()*600,

                    easing:
                        "cubic-bezier(.15,.8,.3,1)"

                }

            ).onfinish =
                () => spark.remove();

        }


        /* =================================
           BLESSING MESSAGE
        ================================= */

        const toast =
            document.createElement(
                "div"
            );


        toast.className =
            "toast";


        toast.textContent =
            "🌺 माँ दुर्गा की कृपा सदैव आप पर बनी रहे! जय माता दी 🙏";


        document.body.appendChild(
            toast
        );


        requestAnimationFrame(
            () => {

                toast.classList.add(
                    "show"
                );

            }
        );


        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );


                setTimeout(
                    () => toast.remove(),
                    500
                );

            },
            3500
        );

    }
);

</script>
