<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#35030b">
<title>दुर्गा पूजा की हार्दिक शुभकामनाएं 🌺</title>
<style>
html,body{margin:0;min-height:100%;background:#25030a;color:#fff2bd}
body{font-family:"Noto Sans Devanagari",sans-serif}
#loading{min-height:100svh;display:grid;place-items:center;color:#ffd66b;font-size:18px;text-align:center}
</style>
</head>
<body>
<div id="loading">॥ जय माता दी ॥<br><small>पेज लोड हो रहा है…</small></div>
<script>
(async()=>{
  const ORIGINAL='https://raw.githubusercontent.com/kargel26/durga26/ed5663e7545d943c8d232f1c73dc2cc670536b12/index.html';
  try{
    const response=await fetch(ORIGINAL,{cache:'no-store'});
    if(!response.ok) throw new Error('Source unavailable');
    let html=await response.text();
    const responsiveImageCSS=`
<style id="responsive-durga-image-fix">
.hero-image{
  width:min(620px,92vw) !important;
  margin:5px auto 0 !important;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero-image img{
  display:block;
  width:100% !important;
  height:auto !important;
  max-height:min(68svh,760px) !important;
  aspect-ratio:auto !important;
  object-fit:contain !important;
  object-position:center !important;
}
.hero-image .halo{
  left:50% !important;
  top:21.5% !important;
  width:24% !important;
  height:auto !important;
  aspect-ratio:1 / 1 !important;
  transform:translate(-50%,-50%) !important;
}
.hero-image .halo::before,
.hero-image .halo::after{pointer-events:none;}

/* Sky Blue Call-to-Action button */
.cta{
  position:relative !important;
  padding-right:52px !important;
  color:#ffffff !important;
  background:linear-gradient(135deg,#87CEFA,#38BDF8,#60A5FA) !important;
  border-color:#BFE8FF !important;
  box-shadow:0 0 22px rgba(56,189,248,.48),0 8px 24px rgba(0,0,0,.2) !important;
}
.cta:hover{
  background:linear-gradient(135deg,#A7E3FF,#38BDF8,#60A5FA) !important;
  box-shadow:0 0 32px rgba(56,189,248,.72),0 10px 28px rgba(0,0,0,.24) !important;
}
.cta::after{
  content:"👆";
  position:absolute;
  right:16px;
  top:50%;
  font-size:20px;
  line-height:1;
  transform:translateY(-45%);
  transform-origin:center bottom;
  animation:clickHand 1s ease-in-out infinite;
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55));
  pointer-events:none;
}
@keyframes clickHand{
  0%,100%{transform:translateY(-45%) scale(1) rotate(0deg);opacity:.9}
  35%{transform:translateY(-45%) scale(1.18) rotate(-7deg);opacity:1}
  55%{transform:translateY(-38%) scale(.94) rotate(5deg);opacity:1}
  72%{transform:translateY(-45%) scale(1.08) rotate(-3deg);opacity:1}
}
@media(max-width:600px){
  .hero-image{width:min(94vw,430px) !important;border-radius:22px;}
  .hero-image img{width:100% !important;height:auto !important;max-height:62svh !important;aspect-ratio:auto !important;object-fit:contain !important;}
  .hero-image .halo{top:21.5% !important;width:24% !important;}
  .cta{padding-right:50px !important;}
  .cta::after{right:14px;font-size:19px;}
}
</style>`;
    html=html.replace('</head>',responsiveImageCSS+'\n</head>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loading').innerHTML='पेज लोड नहीं हो पाया। कृपया दोबारा प्रयास करें।';
    console.error(error);
  }
})();
</script>
</body>
</html>
