    const premiumScript=`
<scr`+`ipt>
(function(){
  function ready(fn){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fn);else fn()}
  ready(function(){
    var target=document.getElementById('premium-durga-ui');
    if(!target)return;
    var parent=target.parentNode;
    var hero=document.querySelector('.hero-image');
    if(hero) parent.insertBefore(target,hero.nextSibling); else parent.appendChild(target);
    var targetDate=new Date('2026-10-16T00:00:00+05:30').getTime();
    function tick(){
      var d=Math.max(0,targetDate-Date.now());
      var days=Math.floor(d/86400000);d%=86400000;
      var hours=Math.floor(d/3600000);d%=3600000;
      var mins=Math.floor(d/60000);d%=60000;
      var secs=Math.floor(d/1000);
      document.getElementById('cd-days').textContent=String(days).padStart(2,'0');
      document.getElementById('cd-hours').textContent=String(hours).padStart(2,'0');
      document.getElementById('cd-minutes').textContent=String(mins).padStart(2,'0');
      document.getElementById('cd-seconds').textContent=String(secs).padStart(2,'0');
      if(targetDate<=Date.now()){document.querySelector('.countdown-title').textContent='🌺 शुभ दुर्गा पूजा 🌺'}
    }
    tick();setInterval(tick,1000);
    document.getElementById('share-whatsapp').onclick=function(){
      var text='🌺 शुभ दुर्गा पूजा 🌺\\n\\nमाँ दुर्गा आपके जीवन में सुख, शांति, शक्ति और समृद्धि का प्रकाश भर दें। 🙏\\n\\n'+location.href;
      location.href='https://wa.me/?text='+encodeURIComponent(text);
    };
    document.getElementById('copy-greeting').onclick=function(){
      navigator.clipboard&&navigator.clipboard.writeText(location.href).then(function(){showToast('🔗 शुभकामना लिंक कॉपी हो गया!')}).catch(function(){showToast('🔗 लिंक कॉपी नहीं हो सका')});
    };
    document.getElementById('blessing-btn').onclick=function(){
      showToast('🌺 माँ दुर्गा आपके जीवन को सुख, शांति और समृद्धि से भर दें! 🙏');
      if(navigator.vibrate)navigator.vibrate([40,40,80]);
      for(var i=0;i<14;i++)setTimeout(makePetal,i*55);
    };
    function showToast(msg){var t=document.getElementById('blessing-toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__bt);window.__bt=setTimeout(function(){t.classList.remove('show')},2600)}
    function makePetal(){var p=document.createElement('span');p.className='petal';p.textContent=Math.random()>.45?'🌸':'✨';p.style.left=(Math.random()*100)+'vw';p.style.fontSize=(12+Math.random()*14)+'px';p.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(p);setTimeout(function(){p.remove()},8500)}
    setInterval(function(){if(!document.hidden)makePetal()},1100);
  });
})();
</scr`+`ipt>`;
    const musicScript=`
<scr`+`ipt>
(function(){
  const src=new URL('${MUSIC}',location.href).href;
  const player=document.createElement('div');
  player.id='bhajan-player';
  player.innerHTML='<button id="bhajan-toggle" type="button" aria-label="भजन चलाएँ">▶</button><span id="bhajan-label">माँ दुर्गा भजन</span><input id="bhajan-volume" type="range" min="0" max="1" step="0.01" value="0.65" aria-label="Volume">';
  const audio=document.createElement('audio');
  audio.id='bhajan-audio';audio.src=src;audio.preload='metadata';audio.loop=true;audio.volume=.65;
  document.body.appendChild(audio);document.body.appendChild(player);
  const btn=document.getElementById('bhajan-toggle'),vol=document.getElementById('bhajan-volume');
  btn.addEventListener('click',async()=>{if(audio.paused){try{await audio.play();btn.textContent='❚❚';btn.setAttribute('aria-label','भजन रोकें')}catch(e){console.error(e)}}else{audio.pause();btn.textContent='▶';btn.setAttribute('aria-label','भजन चलाएँ')}});
  vol.addEventListener('input',()=>audio.volume=Number(vol.value));
})();
</scr`+`ipt>`;
