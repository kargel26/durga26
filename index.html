<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#35030b">
<title>दुर्गा पूजा की हार्दिक शुभकामनाएं 🌺</title>
<style>
html,body{margin:0;min-height:100%;background:#25030a;color:#fff2bd}
body{font-family:"Noto Sans Devanagari",sans-serif}
#loading{min-height:100svh;display:grid;place-items:center;color:#ffd66b;font-size:18px;text-align:center}
</style>
</head>
<body>
<div id="loading">॥ जय माता दी ॥<br><small>पेज लोड हो रहा है…</small></div>
<script>
(async()=>{
  const ORIGINAL='https://raw.githubusercontent.com/kargel26/durga26/ed5663e7545d943c8d232f1c73dc2cc670536b12/index.html';
  const MUSIC='poorartistt-singh-vaahini-maa-bhajan-dedicated-to-maa-durga-565964.mp3';
  try{
    const response=await fetch(ORIGINAL,{cache:'no-store'});
    if(!response.ok) throw new Error('Source unavailable');
    let html=await response.text();
    const responsiveImageCSS=`
<style id="responsive-durga-image-fix">
.hero-image{width:min(620px,92vw) !important;margin:5px auto 0 !important;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-image img{display:block;width:100% !important;height:auto !important;max-height:min(68svh,760px) !important;aspect-ratio:auto !important;object-fit:contain !important;object-position:center !important}
.hero-image .halo{left:50% !important;top:21.5% !important;width:24% !important;height:auto !important;aspect-ratio:1 / 1 !important;transform:translate(-50%,-50%) !important}
.hero-image .halo::before,.hero-image .halo::after{pointer-events:none}
.cta{position:relative !important;padding-right:52px !important;color:#fff !important;background:linear-gradient(135deg,#87CEFA,#38BDF8,#60A5FA) !important;border-color:#BFE8FF !important;box-shadow:0 0 22px rgba(56,189,248,.48),0 8px 24px rgba(0,0,0,.2) !important}
.cta:hover{background:linear-gradient(135deg,#A7E3FF,#38BDF8,#60A5FA) !important;box-shadow:0 0 32px rgba(56,189,248,.72),0 10px 28px rgba(0,0,0,.24) !important}
.cta::after{content:"👆";position:absolute;right:16px;top:50%;font-size:20px;line-height:1;transform:translateY(-45%);transform-origin:center bottom;animation:clickHand 1s ease-in-out infinite;filter:drop-shadow(0 0 5px rgba(255,255,255,.55));pointer-events:none}
@keyframes clickHand{0%,100%{transform:translateY(-45%) scale(1) rotate(0deg);opacity:.9}35%{transform:translateY(-45%) scale(1.18) rotate(-7deg);opacity:1}55%{transform:translateY(-38%) scale(.94) rotate(5deg);opacity:1}72%{transform:translateY(-45%) scale(1.08) rotate(-3deg);opacity:1}}
#bhajan-player{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid rgba(191,232,255,.8);border-radius:999px;background:rgba(10,45,70,.92);box-shadow:0 8px 30px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
#bhajan-toggle{width:42px;height:42px;border:1px solid #BFE8FF;border-radius:50%;background:linear-gradient(135deg,#87CEFA,#38BDF8,#60A5FA);color:#07304a;font-size:19px;cursor:pointer;display:grid;place-items:center}
#bhajan-volume{width:78px;accent-color:#38BDF8;cursor:pointer}
#bhajan-label{font-size:13px;color:#e5f7ff;white-space:nowrap}
@media(max-width:600px){.hero-image{width:min(94vw,430px) !important;border-radius:22px}.hero-image img{width:100% !important;height:auto !important;max-height:62svh !important;aspect-ratio:auto !important;object-fit:contain !important}.hero-image .halo{top:21.5% !important;width:24% !important}.cta{padding-right:50px !important}.cta::after{right:14px;font-size:19px}#bhajan-player{right:10px;bottom:10px;padding:7px}#bhajan-label{display:none}#bhajan-volume{width:60px}}
</style>`;
    const musicScript=`
<scr`+`ipt>
(function(){
  const src=new URL('${MUSIC}',location.href).href;
  const player=document.createElement('div');
  player.id='bhajan-player';
  player.innerHTML='<button id="bhajan-toggle" type="button" aria-label="भजन चलाएँ">▶</button><span id="bhajan-label">माँ दुर्गा भजन</span><input id="bhajan-volume" type="range" min="0" max="1" step="0.01" value="0.65" aria-label="Volume">';
  const audio=document.createElement('audio');
  audio.id='bhajan-audio'; audio.src=src; audio.preload='metadata'; audio.loop=true; audio.volume=.65;
  document.body.appendChild(audio); document.body.appendChild(player);
  const btn=document.getElementById('bhajan-toggle'), vol=document.getElementById('bhajan-volume');
  btn.addEventListener('click',async()=>{if(audio.paused){try{await audio.play();btn.textContent='❚❚';btn.setAttribute('aria-label','भजन रोकें')}catch(e){console.error(e)}}else{audio.pause();btn.textContent='▶';btn.setAttribute('aria-label','भजन चलाएँ')}});
  vol.addEventListener('input',()=>audio.volume=Number(vol.value));
})();
</scr`+`ipt>`;
    html=html.replace('</head>',responsiveImageCSS+'\n</head>');
    html=html.replace('</body>',musicScript+'\n</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loading').innerHTML='पेज लोड नहीं हो पाया। कृपया दोबारा प्रयास करें।';
    console.error(error);
  }
})();
</script>
</body>
</html>
